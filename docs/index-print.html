<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eternal Launcher — Print</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
/>

<link rel="stylesheet" href="src/styles.css" />

<style>
  /* === Print overrides ============================================== */

  /* Force every coloured element to render as it appears on screen. */
  html, body, .page, * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Always-on (screen + print): kill the custom cursor + interactive overlays
     so a static snapshot looks clean. */
  body { cursor: auto !important; }
  .cursor-dot, .cursor-ring,
  .theme-switcher,
  .bubble,
  .particle {
    display: none !important;
  }

  /* Fixed nav, freeze in place at top of page 1 only — turn it into a
     normal-flow header so it doesn't overlap every page. */
  .nav {
    position: static !important;
    transform: none !important;
    left: auto !important;
    top: auto !important;
    margin: 24px auto 0 !important;
  }

  /* Make every reveal element visible immediately. */
  .reveal { opacity: 1 !important; transform: none !important; }

  /* Hold every animated element on its first frame. */
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }

  /* Marquee tracks scroll forever — freeze it. */
  .marquee-track {
    animation: none !important;
    transform: none !important;
  }

  /* Re-enable native scrollbars (just in case) */
  html, body { overflow: visible !important; }

  /* ====== @media print ============================================== */
  @media print {
    @page {
      size: A4 landscape;
      margin: 12mm;
    }

    html, body {
      background: #07070a !important;
      color: var(--fg) !important;
    }

    /* Stop sections from getting split awkwardly across pages */
    .hero, .section, .marquee, .footer, .cta {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .section, .footer { break-before: auto; }

    /* The hero is tall — let it have its own page */
    .hero { break-after: page; page-break-after: always; }
    .marquee { break-after: page; page-break-after: always; }
    .section#features { break-after: page; page-break-after: always; }
    .section#screens  { break-after: page; page-break-after: always; }
    .section#themes   { break-after: page; page-break-after: always; }
    .section#download { break-after: page; page-break-after: always; }

    /* Tighten section padding for print so each chapter fits a page */
    .section { padding: 28px 24px !important; }
    .hero    { padding: 48px 24px 32px !important; }

    /* Feature grid: ensure each card doesn't split */
    .feature-card, .theme-card, .spec, .screenshot-frame {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Pause heavy box-shadows to keep PDFs lean and crisp */
    .feature-card, .theme-card, .screenshot-frame, .cta, .nav, .spec {
      box-shadow: none !important;
    }

    /* Backdrop-filter is expensive in PDF and renders inconsistently */
    .nav, .theme-list, .feature-card, .showcase-detail, .bubble,
    .panel, .theme-trigger, .screenshot-frame {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Force solid fallbacks for translucent panel backgrounds */
    .feature-card { background: #15151d !important; }
    .showcase-detail { background: #15151d !important; }
    .nav { background: #15151d !important; }

    /* Hide the page::before grid mask — keeps things printable cleanly */
    .page::before { opacity: 0.25 !important; }

    /* Disable the page glow orbs that just smear ink across PDF pages */
    .glow-orb { display: none !important; }

    /* Re-allow visible overflow so cropped content prints */
    .page, .hero, .marquee, .section, .footer { overflow: visible !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Data + theme apply -->
<script src="src/themes.js"></script>
<script src="src/copy.js"></script>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Components (order matters — primitives first; app last) -->
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/cursor.jsx"></script>
<script type="text/babel" src="src/nav.jsx"></script>
<script type="text/babel" src="src/hero.jsx"></script>
<script type="text/babel" src="src/features.jsx"></script>
<script type="text/babel" src="src/sections.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<!-- Auto-print after fonts + Babel + a safety delay -->
<script type="text/babel">
  (async () => {
    // Wait for Babel to transpile our other scripts. React mounts inside app.jsx.
    // Give it a beat, then wait for fonts, then print.
    await new Promise(r => setTimeout(r, 400));
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (_) {}
    }
    // Force every reveal element open (in case the IO hasn't fired for offscreen ones)
    document.querySelectorAll('.reveal').forEach(el => el.setAttribute('data-visible', 'true'));
    // Pause the settings demo video at a frame
    document.querySelectorAll('video').forEach(v => {
      try { v.pause(); v.currentTime = Math.min(2, v.duration || 0); } catch (_) {}
    });
    await new Promise(r => setTimeout(r, 600));
    window.print();
  })();
</script>
</body>
</html>
