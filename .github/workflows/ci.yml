name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build (Release, warnings are errors)
        run: dotnet build EternalLauncher.sln -c Release
      - name: Tests
        run: dotnet test --project tests/Eternal.Core.Tests/Eternal.Core.Tests.csproj -c Release --no-build
      - name: Engine tests
        shell: bash
        run: |
          python -m pip install -r engine/requirements.txt
          python -m unittest discover -s engine/tests
          python -I engine/run.py --json --data-dir "$RUNNER_TEMP/eternal" doctor

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package
        run: |
          python -m pip install -r engine/requirements.txt
          python -m pip install -r scripts/requirements-build.txt
          python scripts/package.py --rid ${{ matrix.rid }} --freeze-engine --portable
      - name: Installer
        if: matrix.rid == 'win-x64'
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eternal-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*.tar.gz
            artifacts/${{ matrix.rid }}/*.zip
            artifacts/*.exe
