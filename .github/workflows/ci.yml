name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (Release, warnings are errors)
        run: dotnet build EternalLauncher.sln -c Release
      - name: Engine check
        shell: bash
        run: |
          python -m pip install -r engine/requirements.txt
          python -I engine/run.py --json --data-dir "$RUNNER_TEMP/eternal" doctor

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        run: |
          python -m pip install -r engine/requirements.txt pyinstaller
          python scripts/package.py --rid ${{ matrix.rid }} --freeze-engine --portable
      - name: Installer
        if: matrix.rid == 'win-x64'
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*.tar.gz
            artifacts/${{ matrix.rid }}/*.zip
            artifacts/*.exe
